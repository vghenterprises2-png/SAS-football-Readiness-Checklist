<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAS Readiness vNext Admin Test</title><style>
:root{--navy:#0b1f3a;--gold:#d8a928;--paper:#f5f3ed;--line:#d9dee7;--ok:#237a52;--bad:#a53131}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#172033;font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--navy);color:#fff;padding:18px}.wrap{max-width:1200px;margin:auto}.eyebrow{color:#f1ce68;font-size:.75rem;font-weight:800;letter-spacing:.12em}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.badge{font-size:.75rem}.status{margin-top:7px;font-size:.8rem}.tabs{display:flex;gap:8px;overflow:auto;padding:14px 0}.tabs button,.btn{min-height:44px;border:1px solid #cbd2dc;border-radius:10px;padding:9px 13px;background:#fff;color:var(--navy);font-weight:800}.tabs button.active,.btn.primary{background:var(--navy);color:#fff}.page{padding:0 16px 30px}.hero,.panel{background:#fff;border-radius:15px;padding:16px;box-shadow:0 7px 20px #0b1f3a12;margin-bottom:14px}.hero{border-top:5px solid var(--gold)}label{display:block;font-size:.78rem;font-weight:800;margin-top:10px}input,select,textarea{width:100%;min-height:44px;border:1px solid #cbd2dc;border-radius:9px;padding:9px;background:#fff;font:inherit}textarea{min-height:90px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.result{margin-top:12px;padding:11px;border-radius:9px;background:#edf7f1;color:#175d3b}.result.error{background:#fff0f0;color:#842525}.history{margin-top:14px;border-top:1px solid var(--line)}.entry{padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem}.muted{color:#667085;font-size:.78rem}.hidden{display:none!important}table{border-collapse:collapse;width:100%;font-size:.82rem}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}.tablewrap{overflow:auto}@media(max-width:720px){.grid,.grid3{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
.btn{transition:transform .08s ease,box-shadow .12s ease,background-color .12s ease}.btn.pressed{transform:scale(.96);box-shadow:inset 0 2px 5px #0003}.btn.saving,.btn:disabled{background:#d8a928!important;color:#0b1f3a!important;border-color:#d8a928;cursor:wait;opacity:1}.btn.saved{background:#237a52!important;color:#fff!important;border-color:#237a52}</style></head><body><header><div class="wrap"><div class="top"><div><div class="eyebrow">ST. ALOYSIUS FOOTBALL</div><h2 style="margin:3px 0">Readiness Admin Workspace</h2></div><div class="badge">v1.2.1 · TEST</div></div><div id="connection" class="status">Connecting to test database…</div></div></header><main class="wrap page">
<section class="hero"><div class="grid"><div><label>Active user</label><select id="coach"><option>Loading…</option></select></div><div><label>Workspace</label><div class="tabs" id="tabs"><button data-tab="maintenance" class="active">Maintenance</button><button data-tab="comments">General Comments</button><button data-tab="manual">Paper Entry</button><button data-tab="admin">Protection & Health</button><button data-tab="reports">Reports</button></div></div></div></section>
<section id="maintenance" class="panel view"><h3>Maintenance update</h3><div class="grid3"><div><label>Equipment item</label><select class="item"></select></div><div><label>Status</label><select id="mStatus"><option>Open</option><option>In Progress</option><option>Resolved</option></select></div><div><label>Due date</label><input id="mDue" type="date"></div></div><label>Append-only maintenance note</label><textarea id="mText" placeholder="Describe what was found, completed, or still needed. Phone dictation is supported."></textarea><div class="actions"><button class="btn primary" id="saveMaintenance">Add update</button><button class="btn" id="loadHistory">View item history</button></div><div id="mResult"></div><div id="history" class="history"></div></section>
<section id="comments" class="panel view hidden"><h3>General comments</h3><div class="grid"><div><label>Topic</label><input id="cTopic" placeholder="Equipment, facility, safety…"></div><div><label>Comment type</label><select id="cType"><option>General</option><option>Question</option><option>Concern</option><option>Suggestion</option><option>Safety</option></select></div></div><label>Comment</label><textarea id="cText" placeholder="Shared operational comment"></textarea><div class="actions"><button class="btn primary" id="saveComment">Add comment</button><button class="btn" id="loadComments">Check for New Comments</button></div><div id="cResult"></div><div id="commentsList" class="history"></div></section>
<section id="manual" class="panel view hidden"><h3>Enter a paper inspection</h3><div class="grid3"><div><label>Original inspector</label><select id="inspector"></select></div><div><label>Inspection date</label><input id="inspectionDate" type="date"></div><div><label>Equipment item</label><select class="item"></select></div></div><div class="grid3"><div><label>Status</label><select id="pStatus"><option>Open</option><option>Complete</option></select></div><div><label>Quantity</label><input id="pQuantity"></div><div><label>Maintenance flag</label><select id="pFlag"><option value="No">No</option><option value="Yes">Yes</option></select></div></div><label>Flag reason</label><input id="pReason"><label>Original paper notes</label><textarea id="pNotes"></textarea><div class="actions"><button class="btn primary" id="savePaper">Submit paper entry</button></div><div id="pResult"></div></section>
<section id="admin" class="panel view hidden"><h3>Administrative protection and health override</h3><div class="grid"><div><label>Equipment item</label><select class="item"></select></div><div><label>Required reason</label><input id="aReason" placeholder="Why is this administrative action needed?"></div></div><div class="actions"><button class="btn primary" id="protect">Protect record</button><button class="btn" id="unlock">Unlock record</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="grid"><div><label>Health status override</label><select id="health"><option>Good</option><option>Needs Attention</option><option>Critical</option><option>Out of Service</option><option>Not Recently Inspected</option></select></div><div class="actions"><button class="btn primary" id="override">Apply override</button></div></div><div id="aResult"></div></section>
<section id="reports" class="panel view hidden"><h3>Search and report</h3><div class="grid3"><div><label>Search</label><input id="rSearch" list="reportSuggestions" autocomplete="off" placeholder="Start typing an item, category, or ID…"><datalist id="reportSuggestions"></datalist><div class="muted">Suggestions appear as you type; partial words also work.</div></div><div><label>Status</label><select id="rStatus"><option value="">All</option><option>Open</option><option>Complete</option></select></div><div class="actions"><button class="btn primary" id="runReport">Run report</button><button class="btn" id="csv">Export CSV</button></div></div><div id="report" class="tablewrap"></div></section>
</main><script>
const API='https://script.google.com/macros/s/AKfycbwGG34doMDN9dkpfN-yKpSxEhS94AooAWK1hVWm_nqiz6KeowvAHrMf9Mc-rNPuaEBa/exec';let items=[],coaches=[],reportRows=[];const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rid=()=>`WEB-${Date.now()}-${Math.random().toString(36).slice(2)}`;
let postInFlight=false,lastActionButton=null;document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn');if(!b||b.disabled)return;lastActionButton=b;b.classList.add('pressed');setTimeout(()=>b.classList.remove('pressed'),140)},true);async function get(action,p={}){const u=new URL(API);u.search=new URLSearchParams({action,...p});const r=await fetch(u);const d=await r.json();if(!d.ok)throw Error(d.error||'Request failed');return d}async function post(body){if(postInFlight)throw Error('That save is already processing. Please wait.');postInFlight=true;const buttons=all('.btn'),active=lastActionButton,oldLabel=active?active.textContent:'';buttons.forEach(b=>b.disabled=true);if(active){active.classList.add('saving');active.textContent='Saving…'}const previous=$('#connection').textContent;$('#connection').textContent='Saving…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});const d=await r.json();if(!d.ok)throw Error(d.error||'Save failed');if(active){active.classList.remove('saving');active.classList.add('saved');active.textContent='Saved ✓';await new Promise(resolve=>setTimeout(resolve,650))}return d}finally{postInFlight=false;buttons.forEach(b=>b.disabled=false);if(active){active.classList.remove('saving','saved');active.textContent=oldLabel}$('#connection').textContent=previous;lastActionButton=null}}function who(){const v=$('#coach').value;if(!v)throw Error('Select an active user first.');return v}function selectedItem(view){return view.querySelector('.item').value}function result(el,msg,error=false){el.className='result'+(error?' error':'');el.textContent=msg}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;all('#tabs button').forEach(x=>x.classList.toggle('active',x===b));all('.view').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.tab))};
async function load(){try{const [c,k,p]=await Promise.all([get('coaches'),get('checklist'),get('ping')]);coaches=c.coaches;items=k.items;$('#coach').innerHTML='<option value="">Select user…</option>'+coaches.map(x=>`<option>${esc(x.name)}</option>`).join('');$('#inspector').innerHTML=coaches.map(x=>`<option>${esc(x.name)}</option>`).join('');const opts=items.map(x=>`<option value="${esc(x['Item ID'])}">${esc(x['Item ID']+' · '+x.Asset+' · '+x.Requirement)}</option>`).join('');all('.item').forEach(x=>x.innerHTML=opts);const suggestions=[...new Set(items.flatMap(x=>[x['Item ID'],x.Category,x.Subcategory,x.Asset,x.Requirement]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));$('#reportSuggestions').innerHTML=suggestions.map(x=>`<option value="${esc(x)}"></option>`).join('');$('#inspectionDate').value=new Date().toISOString().slice(0,10);$('#connection').textContent=`Connected · ${p.environment} · ${items.length} checks`;$('#connection').style.color='#7ee2a8'}catch(e){$('#connection').textContent='Connection failed: '+e.message;$('#connection').style.color='#ff9b9b'}}
$('#saveMaintenance').onclick=async()=>{try{const v=$('#maintenance');await post({action:'addMaintenanceUpdate',requestId:rid(),itemId:selectedItem(v),coach:who(),status:$('#mStatus').value,text:$('#mText').value,dueDate:$('#mDue').value,source:'Admin Dashboard'});result($('#mResult'),'Maintenance update saved.');$('#mText').value='';$('#loadHistory').click()}catch(e){result($('#mResult'),e.message,true)}};
$('#loadHistory').onclick=async()=>{try{const d=await get('itemhistory',{itemId:selectedItem($('#maintenance'))});const rows=[...d.history.notes.map(x=>({...x,kind:'Note'})),...d.history.maintenance.map(x=>({...x,kind:'Maintenance'}))].sort((a,b)=>String(b.Timestamp).localeCompare(String(a.Timestamp)));$('#history').innerHTML=rows.length?rows.map(x=>`<div class="entry"><b>${esc(x.kind)} · ${esc(x.Status||x['Note Type']||'')}</b><div>${esc(x.Text)}</div><div class="muted">${esc(x.Coach)} · ${esc(x.Timestamp)}</div></div>`).join(''):'<div class="entry muted">No history yet.</div>'}catch(e){result($('#mResult'),e.message,true)}};
$('#saveComment').onclick=async()=>{try{await post({action:'addGeneralComment',requestId:rid(),coach:who(),topic:$('#cTopic').value,commentType:$('#cType').value,text:$('#cText').value});result($('#cResult'),'Comment added.');$('#cText').value='';$('#loadComments').click()}catch(e){result($('#cResult'),e.message,true)}};$('#loadComments').onclick=async()=>{try{const d=await get('generalcomments');$('#commentsList').innerHTML=d.comments.slice().reverse().map(x=>`<div class="entry"><b>${esc(x.Topic)} · ${esc(x['Comment Type'])}</b><div>${esc(x.Text)}</div><div class="muted">${esc(x.Coach)} · ${esc(x.Timestamp)}</div></div>`).join('')||'<div class="entry muted">No comments yet.</div>'}catch(e){result($('#cResult'),e.message,true)}};
$('#savePaper').onclick=async()=>{try{const v=$('#manual'),id=selectedItem(v),item=items.find(x=>x['Item ID']===id);await post({action:'manualEntry',requestId:rid(),inspectionDate:$('#inspectionDate').value,inspector:$('#inspector').value,enteredBy:who(),itemId:id,status:$('#pStatus').value,quantity:$('#pQuantity').value,flagged:$('#pFlag').value==='Yes',flagReason:$('#pReason').value,notes:$('#pNotes').value,version:item.Version});result($('#pResult'),'Paper inspection entered with attribution and timestamp.')}catch(e){result($('#pResult'),e.message,true)}};
async function adminAction(action){try{const v=$('#admin');await post({action,requestId:rid(),recordType:'Checklist',recordId:selectedItem(v),itemId:selectedItem(v),administrator:who(),reason:$('#aReason').value,healthStatus:$('#health').value});result($('#aResult'),action==='protectRecord'?'Record protected.':action==='unlockRecord'?'Record unlocked.':'Health override saved.')}catch(e){result($('#aResult'),e.message,true)}}$('#protect').onclick=()=>adminAction('protectRecord');$('#unlock').onclick=()=>adminAction('unlockRecord');$('#override').onclick=()=>adminAction('setHealthOverride');
$('#runReport').onclick=async()=>{try{const d=await get('report',{search:$('#rSearch').value,status:$('#rStatus').value});reportRows=d.rows;$('#report').innerHTML=`<table><thead><tr><th>ID</th><th>Category</th><th>Asset</th><th>Requirement</th><th>Status</th><th>Coach</th></tr></thead><tbody>${reportRows.map(x=>`<tr><td>${esc(x['Item ID'])}</td><td>${esc(x.Category)}</td><td>${esc(x.Asset)}</td><td>${esc(x.Requirement)}</td><td>${esc(x.Status)}</td><td>${esc(x['Last Updated By'])}</td></tr>`).join('')}</tbody></table>`}catch(e){$('#report').textContent=e.message}};$('#csv').onclick=()=>{if(!reportRows.length)return alert('Run a report first.');const h=['Item ID','Category','Asset','Requirement','Status','Last Updated By'];const csv=[h,...reportRows.map(x=>h.map(k=>x[k]??''))].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='sas-readiness-report.csv';a.click();URL.revokeObjectURL(a.href)};load();
</script></body></html>
