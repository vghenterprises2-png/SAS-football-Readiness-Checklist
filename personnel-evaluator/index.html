<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAS Personnel Evaluator</title>
<style>
:root{--navy:#14243a;--blue:#2f6fca;--bg:#f3f5f7;--card:#fff;--line:#dce2e8;--muted:#687586;--good:#16783a;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#182230;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:14px 16px;font-weight:900}.page{display:none;max-width:760px;margin:auto;padding:14px 14px 96px}.page.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 4px 14px rgba(20,36,58,.06)}.context{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:850}.title-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title-row h1{font-size:24px;margin:4px 0}.sub{font-size:13px;color:var(--muted)}.pill{white-space:nowrap;background:#eaf1fb;color:var(--blue);padding:7px 9px;border-radius:99px;font-size:12px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{text-align:center;padding:11px}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}.toolbar input,.toolbar select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px}.list{display:grid;gap:8px}.player{width:100%;text-align:left;border:1px solid var(--line);border-radius:13px;background:#fff;padding:13px;display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center}.player.current{border-color:#94b4df;box-shadow:0 0 0 2px #dce8f8 inset}.player.done{background:#f5fbf7}.status{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-weight:900}.done .status{background:#e9f7ee;color:var(--good)}.current .status{background:#eaf1fb;color:var(--blue)}.name{font-weight:900}.meta{font-size:12px;color:var(--muted);margin-top:2px}.tag{font-size:11px;font-weight:850;background:#f0f2f4;color:var(--muted);padding:5px 7px;border-radius:99px}.current .tag{background:#eaf1fb;color:var(--blue)}.done .tag{background:#e9f7ee;color:var(--good)}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:20}.bottom-inner{max-width:760px;margin:auto;display:flex;gap:10px}.btn{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:12px 15px;font-weight:900;flex:1}.btn.secondary{background:#fff;color:#182230;border:1px solid var(--line)}.player-card{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.player-card h2{margin:0;font-size:22px}.progress{display:flex;gap:6px;overflow:auto;margin:10px 0}.step{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;padding:6px 8px;font-size:11px;font-weight:800}.step.done{background:#e9f7ee;color:var(--good)}.accordion{display:grid;gap:9px}.acc{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.acc-head{width:100%;border:0;background:#fff;padding:14px;display:flex;justify-content:space-between;font-weight:900}.acc-body{display:none;padding:0 14px 14px}.acc.open .acc-body{display:block}.rating{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #edf0f3}.rating:first-child{border-top:0}.rating-name{font-weight:850}.rating small{display:block;color:var(--muted);margin-top:2px}.rates{display:flex;gap:5px}.rate{width:40px;height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:18px;font-weight:900}.rate.sel.plus{background:#e9f7ee;color:var(--good)}.rate.sel.check{background:#eaf1fb;color:var(--blue)}.rate.sel.minus{background:#fdecea;color:var(--bad)}.flags{display:flex;gap:7px;flex-wrap:wrap}.flag{border:1px solid var(--line);border-radius:99px;background:#fff;padding:8px 10px;font-weight:800}.flag.sel{background:#eaf1fb;color:var(--blue);border-color:#a9c1e2}.hidden{display:none!important}.empty{display:none;text-align:center;color:var(--muted);padding:20px}.empty.show{display:block}@media(max-width:480px){.toolbar{grid-template-columns:1fr}.player{grid-template-columns:auto 1fr}.tag{grid-column:2;justify-self:start}}
</style>
</head>
<body>
<div class="top">SAS Football Operations</div>
<section id="queue" class="page active">
  <div class="card">
    <div class="context">Tuesday Practice · Individual</div>
    <div class="title-row"><div><h1>Reach Block</h1><div class="sub">Offensive Line · 8 players</div></div><div class="pill"><span id="doneTop">0</span> of 8 complete</div></div>
  </div>
  <div class="stats">
    <div class="card stat"><b id="doneStat">0</b><span>Completed</span></div>
    <div class="card stat"><b id="remainStat">8</b><span>Remaining</span></div>
    <div class="card stat"><b id="currentStat">#72</b><span>Current</span></div>
  </div>
  <div class="toolbar">
    <input id="search" list="suggestions" placeholder="Type name or jersey number..." autocomplete="off">
    <datalist id="suggestions"></datalist>
    <select id="filter"><option value="all">All players</option><option value="remaining">Remaining</option><option value="completed">Completed</option></select>
  </div>
  <div id="list" class="list"></div><div id="empty" class="empty">No players match that search.</div>
  <div class="bottom"><div class="bottom-inner"><button id="openCurrent" class="btn">Evaluate Current Player</button></div></div>
</section>
<section id="evaluate" class="page">
  <div class="card player-card"><div><div class="context">Reach Block · Offensive Line</div><h2 id="evalName"></h2><div id="evalMeta" class="sub"></div></div><div class="pill">Player <span id="playerNum">1</span> of 8</div></div>
  <div class="progress"><span class="step" data-step="position">○ Position Skills</span><span class="step" data-step="core">○ Core Traits</span><span class="step" data-step="athletic">○ Athletic</span><span class="step" data-step="observation">○ Observation</span><span class="step" data-step="flags">○ Flags</span></div>
  <div id="accordion" class="accordion"></div>
  <div class="bottom"><div class="bottom-inner"><button id="back" class="btn secondary">Back to Queue</button><button id="save" class="btn">Save & Next</button></div></div>
</section>
<script>
const roster=[
{id:1,n:'#72 Tyler Grant',p:'OG',y:'Sophomore'},{id:2,n:'#68 Mason Hill',p:'OT',y:'Junior'},{id:3,n:'#74 Carter Brooks',p:'C',y:'Sophomore'},{id:4,n:'#65 Evan Lewis',p:'OG',y:'Senior'},{id:5,n:'#77 Jordan Price',p:'OT',y:'Junior'},{id:6,n:'#70 Noah King',p:'C',y:'Freshman'},{id:7,n:'#73 Lucas Ward',p:'OG',y:'Junior'},{id:8,n:'#79 Caleb Ross',p:'OT',y:'Sophomore'},
{id:9,n:'#12 Eli Turner',p:'QB',y:'Senior'},{id:10,n:'#5 Marcus Reed',p:'QB',y:'Sophomore'},{id:11,n:'#22 Isaiah Cole',p:'RB',y:'Junior'},{id:12,n:'#28 Devin Moore',p:'RB',y:'Freshman'},{id:13,n:'#3 Jaylen Scott',p:'WR',y:'Senior'},{id:14,n:'#9 Andre Bell',p:'WR',y:'Junior'},{id:15,n:'#14 Kaden White',p:'WR',y:'Sophomore'},{id:16,n:'#81 Owen Clark',p:'TE',y:'Junior'},{id:17,n:'#88 Bryce Hall',p:'TE',y:'Freshman'},{id:18,n:'#90 Damien Young',p:'DE',y:'Senior'},{id:19,n:'#95 Trent Parker',p:'DT',y:'Junior'},{id:20,n:'#92 Roman Davis',p:'DT',y:'Sophomore'},{id:21,n:'#44 Malik Foster',p:'LB',y:'Senior'},{id:22,n:'#52 Cole Bennett',p:'LB',y:'Junior'},{id:23,n:'#47 Jace Morgan',p:'LB',y:'Sophomore'},{id:24,n:'#1 Nate Simmons',p:'CB',y:'Senior'},{id:25,n:'#7 Cameron Lee',p:'CB',y:'Junior'},{id:26,n:'#11 Micah Green',p:'S',y:'Sophomore'},{id:27,n:'#16 Logan James',p:'S',y:'Freshman'},{id:28,n:'#36 Aaron Miles',p:'K',y:'Junior'},{id:29,n:'#39 Ben Carter',p:'P',y:'Senior'},{id:30,n:'#41 Sean Wright',p:'LS',y:'Sophomore'},{id:31,n:'#6 Chris Allen',p:'ATH',y:'Junior'},{id:32,n:'#18 Trey Howard',p:'ATH',y:'Sophomore'},{id:33,n:'#24 Mason Gray',p:'FB',y:'Senior'},{id:34,n:'#33 Dylan Cox',p:'H',y:'Junior'},{id:35,n:'#60 Aiden Brooks',p:'OL',y:'Freshman'}];
const activity=roster.slice(0,8);let state=activity.map((p,i)=>({id:p.id,done:false,current:i===0}));let active=0;
const sections=[['position','Position Skills',['First Step','Hat Placement','Hand Placement','Footwork','Finish']],['core','Core Traits',['Effort','Physicality','Competitiveness','Coachability','Communication']],['athletic','Athletic Development',['Movement','Balance','Body Control','Explosion']]];
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}
function renderQueue(){const list=document.getElementById('list');list.innerHTML=state.map((s,i)=>{const p=activity[i],label=s.done?'Completed':s.current?'Current':'Not started',icon=s.done?'✓':s.current?'▶':'○';return `<button class="player ${s.done?'done':''} ${s.current?'current':''}" data-i="${i}" data-status="${s.done?'completed':'remaining'}"><span class="status">${icon}</span><span><span class="name">${p.n}</span><span class="meta">${p.p} · ${p.y}</span></span><span class="tag">${label}</span></button>`}).join('');list.querySelectorAll('.player').forEach(b=>b.onclick=()=>openPlayer(+b.dataset.i));stats();filterList()}
function stats(){const done=state.filter(x=>x.done).length,current=state.findIndex(x=>x.current);doneTop.textContent=done;doneStat.textContent=done;remainStat.textContent=8-done;currentStat.textContent=activity[current<0?0:current].n.split(' ')[0]}
function filterList(){const q=search.value.toLowerCase(),f=filter.value;let visible=0;document.querySelectorAll('.player').forEach(b=>{const okText=b.textContent.toLowerCase().includes(q),okFilter=f==='all'||b.dataset.status===f,show=okText&&okFilter;b.classList.toggle('hidden',!show);if(show)visible++});empty.classList.toggle('show',visible===0)}
function ratingRows(key,items){return items.map(x=>`<div class="rating" data-key="${key}"><div><span class="rating-name">${x}</span><small>Select Plus, Check, or Minus</small></div><div class="rates"><button class="rate plus">+</button><button class="rate check">✓</button><button class="rate minus">−</button></div></div>`).join('')}
function renderEvaluator(){accordion.innerHTML=sections.map((s,i)=>`<div class="acc ${i===0?'open':''}" data-section="${s[0]}"><button class="acc-head"><span>${s[1]}</span><span>⌄</span></button><div class="acc-body">${ratingRows(s[0],s[2])}</div></div>`).join('')+`<div class="acc" data-section="observation"><button class="acc-head"><span>Observation</span><span>⌄</span></button><div class="acc-body"><textarea id="note" placeholder="Type an observation..."></textarea></div></div><div class="acc" data-section="flags"><button class="acc-head"><span>Flags</span><span>⌄</span></button><div class="acc-body"><div class="flags"><button class="flag">Standout</button><button class="flag">Needs Follow-Up</button><button class="flag">Injury Concern</button><button class="flag">Leadership</button></div></div></div>`;document.querySelectorAll('.acc-head').forEach(h=>h.onclick=()=>{const a=h.parentElement,was=a.classList.contains('open');document.querySelectorAll('.acc').forEach(x=>x.classList.remove('open'));if(!was)a.classList.add('open')});document.querySelectorAll('.rates').forEach(g=>g.querySelectorAll('.rate').forEach(b=>b.onclick=()=>{g.querySelectorAll('.rate').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');progress()}));document.querySelectorAll('.flag').forEach(b=>b.onclick=()=>{b.classList.toggle('sel');progress()});note.oninput=progress;progress()}
function progress(){sections.forEach(s=>{const rows=[...document.querySelectorAll(`.rating[data-key="${s[0]}"]`)],done=rows.length&&rows.every(r=>r.querySelector('.rate.sel'));mark(s[0],done)});mark('observation',note.value.trim().length>0);mark('flags',document.querySelectorAll('.flag.sel').length>0)}
function mark(key,done){const x=document.querySelector(`[data-step="${key}"]`);x.classList.toggle('done',done);x.textContent=(done?'✓ ':'○ ')+x.textContent.replace(/^[✓○]\s/,'')}
function openPlayer(i){active=i;state.forEach((x,j)=>x.current=j===i);const p=activity[i];evalName.textContent=p.n;evalMeta.textContent=`${p.p} · ${p.y}`;playerNum.textContent=i+1;renderEvaluator();show('evaluate')}
function saveNext(){if(!document.querySelector('.rate.sel')){alert('Select at least one rating before saving.');return}state[active].done=true;let next=state.findIndex((x,i)=>!x.done&&i>active);if(next<0)next=state.findIndex(x=>!x.done);state.forEach(x=>x.current=false);if(next<0){state[active].current=true;renderQueue();show('queue');alert('All 8 players are complete.');return}active=next;state[next].current=true;renderQueue();openPlayer(next)}
search.oninput=filterList;filter.onchange=filterList;openCurrent.onclick=()=>openPlayer(Math.max(0,state.findIndex(x=>x.current)));back.onclick=()=>{renderQueue();show('queue')};save.onclick=saveNext;suggestions.innerHTML=activity.map(p=>`<option value="${p.n}">${p.p} · ${p.y}</option>`).join('');renderQueue();
</script>
</body>
</html>
